<!DOCTYPE html>
<!-- HRMS-404 我的中心 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('我的中心','my')}"></head>
<body>
<header th:replace="~{fragments :: topbar('my')}"></header>

<main class="app-container">
    <div class="d-flex align-items-center gap-3 mb-3">
        <div>
            <h1 class="page-title">我的中心</h1>
            <div class="page-sub" th:text="|${session.LOGIN_USER.roleName} · ${session.LOGIN_USER.deptName} · ${session.LOGIN_USER.positionName}|">
                个人信息 · 我的考勤 · 我的薪资
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card card-panel h-100">
                <div class="card-header bg-white border-0 pt-3"><span class="fw-semibold">👤 我的档案</span></div>
                <div class="card-body" id="myInfo">
                    <div class="text-secondary small">加载中…</div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card card-panel mb-3">
                <div class="card-header bg-white border-0 pt-3 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">🕘 我的本月考勤</span>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="month" class="form-control form-control-sm" id="myMonth" style="width:160px"
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM')}">
                        <button class="btn btn-sm btn-outline-dark" onclick="loadAtt()">查看</button>
                    </div>
                </div>
                <div class="card-body table-responsive p-0" id="myAttArea"></div>
            </div>
            <div class="card card-panel">
                <div class="card-header bg-white border-0 pt-3"><span class="fw-semibold">💰 我的薪资记录</span></div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-hover align-middle mb-0 table-card">
                        <thead><tr><th>月份</th><th>基本工资</th><th>绩效</th><th>扣款</th><th class="text-end">实发工资</th></tr></thead>
                        <tbody id="salBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
<div th:replace="~{fragments :: globalActions}"></div>
<script>
    async function loadInfo() {
        const info = await api("/api/my/info", { silent: true });
        const el = document.getElementById("myInfo");
        if (!info) {
            el.innerHTML = `<div class="text-secondary small">当前账号未绑定员工档案（管理员账号）。</div>`;
            return;
        }
        el.innerHTML = `<ul class="list-group list-group-flush">
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">工号</span><b>${esc(info.empNo)}</b></li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">姓名</span><b>${esc(info.empName)}</b></li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">性别 / 出生</span>${esc(info.gender)} · ${esc(fmtDate(info.birthDate))}</li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">电话</span>${esc(info.phone || "-")}</li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">邮箱</span>${esc(info.email || "-")}</li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">部门 / 职位</span>${esc(info.deptName)} · ${esc(info.positionName)}</li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">入职日期</span>${esc(fmtDate(info.hireDate))}</li>
            <li class="list-group-item px-2 d-flex justify-content-between"><span class="text-secondary">状态</span>${empStatusBadge(info.status)}</li>
        </ul>`;
    }

    async function loadAtt() {
        const month = document.getElementById("myMonth").value || monthNow();
        const rows = await api("/api/my/attendance?month=" + month, { silent: true });
        const area = document.getElementById("myAttArea");
        if (!rows || !rows.length) {
            area.innerHTML = `<div class="p-4">${empty404(`404：${month} 暂无打卡记录`)}</div>`;
            return;
        }
        area.innerHTML = `<table class="table table-hover align-middle mb-0 table-card">
            <thead><tr><th>日期</th><th>上班打卡</th><th>下班打卡</th><th>状态</th></tr></thead>
            <tbody>${rows.map(r => `<tr>
                <td>${esc(fmtDate(r.workDate))}</td>
                <td>${r.checkInTime ? esc(fmtDateTime(r.checkInTime)) : "-"}</td>
                <td>${r.checkOutTime ? esc(fmtDateTime(r.checkOutTime)) : "-"}</td>
                <td>${attBadge(r.status)}</td>
            </tr>`).join("")}</tbody></table>`;
    }

    async function loadSal() {
        const rows = await api("/api/my/salaries", { silent: true });
        const body = document.getElementById("salBody");
        if (!rows || !rows.length) {
            body.innerHTML = `<tr><td colspan="5" class="text-center text-secondary py-4">暂无薪资记录（等待 HR 生成）</td></tr>`;
            return;
        }
        body.innerHTML = rows.map(r => `
            <tr>
              <td><b>${esc(r.salaryMonth)}</b></td>
              <td>¥ ${money(r.baseSalary)}</td>
              <td>¥ ${money(r.performance)}</td>
              <td class="${Number(r.deduction) > 0 ? 'text-danger' : ''}">¥ ${money(r.deduction)}</td>
              <td class="text-end"><b>¥ ${money(r.actualSalary)}</b></td>
            </tr>`).join("");
    }

    loadInfo();
    loadAtt();
    loadSal();
</script>
</body>
</html>
