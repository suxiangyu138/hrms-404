<!DOCTYPE html>
<!-- HRMS-404 考勤打卡 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('考勤打卡','attendance')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('attendance')}"></aside>
    <div class="main-col">
        <div th:replace="~{fragments :: topbar('attendance')}"></div>

<main class="app-container">
    <div class="page-head">
        <div>
            <h1 class="page-title" th:text="${session.LOGIN_USER.roleCode == 'EMPLOYEE'} ? '我的考勤' : '考勤管理'">考勤打卡</h1>
            <div class="page-sub" th:text="${session.LOGIN_USER.roleCode == 'MANAGER'} ? '数据范围：本部门及其子部门' : '每日一卡：9:00 后打卡记迟到，18:00 前下班记早退'">
                每日一卡：9:00 后打卡记迟到，18:00 前下班记早退
            </div>
        </div>
    </div>

    <!-- 今日打卡状态卡片（仅绑定员工的账号可见） -->
    <div class="card card-panel mb-4" th:if="${session.LOGIN_USER.empId != null}" id="todayPanel" style="display:none">
        <div class="card-body p-4 att-card">
            <div>
                <div class="text-secondary" style="font-size:13px">今日考勤</div>
                <div class="clock-time mt-1" id="clockBig">--:--</div>
                <div class="text-secondary mt-1" id="clockMsg" style="font-size:13px"></div>
            </div>
            <div class="d-flex gap-4 ms-auto">
                <button class="clock-btn in" id="btnIn" onclick="doClock('clock-in')">
                    <span>上班打卡</span><small style="font-weight:400;opacity:.85">9:00 前</small>
                </button>
                <button class="clock-btn out" id="btnOut" onclick="doClock('clock-out')">
                    <span>下班打卡</span><small style="font-weight:400;opacity:.85">18:00 后</small>
                </button>
            </div>
        </div>
    </div>

    <!-- 月度视图：日历 + 记录（员工为本人，其他角色可切换查看本人日历） -->
    <div th:if="${session.LOGIN_USER.empId != null}" class="row g-3 mb-2">
        <div class="col-xl-5">
            <div class="card card-panel h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <button class="btn btn-outline-secondary btn-sm px-2" onclick="shiftMonth(-1)">&lt;</button>
                        <div class="fw-semibold" id="calTitle" style="font-size:15px"></div>
                        <button class="btn btn-outline-secondary btn-sm px-2" onclick="shiftMonth(1)">&gt;</button>
                    </div>
                    <table class="table calendar mb-0">
                        <thead><tr class="text-secondary" style="font-size:12px">
                            <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th>
                        </tr></thead>
                        <tbody id="calBody"></tbody>
                    </table>
                    <div class="d-flex gap-4 mt-2 small text-secondary">
                        <span><span class="dot ok">●</span> 正常打卡</span>
                        <span><span class="dot bad">●</span> 迟到/早退</span>
                        <span><span class="status-pill status-on" style="font-size:0"></span> 今日</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-7">
            <div class="card card-panel table-card h-100">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>日期</th><th>上班打卡</th><th>下班打卡</th><th>状态</th></tr></thead>
                        <tbody id="myAttBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 月度汇总（ADMIN / HR 全量，MANAGER 本部门子树） -->
    <div th:if="${session.LOGIN_USER.roleCode != 'EMPLOYEE'}" class="mt-3">
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="text-secondary small">汇总月份</span>
            <input type="month" class="form-control form-control-sm" id="sumMonth"
                   style="width:160px" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM')}">
            <button class="btn btn-outline-brand btn-sm px-3" onclick="loadSummary()">查看</button>
            <button class="btn btn-text ms-auto" onclick="exportSummary()">导出 CSV</button>
        </div>
        <div class="card card-panel table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr>
                        <th>员工姓名</th><th>部门</th><th>出勤天数</th><th>正常</th>
                        <th>迟到</th><th>早退</th><th>出勤率</th>
                    </tr></thead>
                    <tbody id="sumBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

        <div th:replace="~{fragments :: footer}"></div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
<div th:replace="~{fragments :: globalActions}"></div>
<script>
    const role = CTX.role;
    let calMonth = new Date(), monthRows = [], myRecords = [];

    function pad2(n) { return String(n).padStart(2, "0"); }
    const ymOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;

    async function initToday() {
        const t = await api("/api/attendance/today", { silent: true });
        const panel = document.getElementById("todayPanel");
        if (panel) panel.style.display = "";
        const big = document.getElementById("clockBig"), msg = document.getElementById("clockMsg");
        const btnIn = document.getElementById("btnIn"), btnOut = document.getElementById("btnOut");
        if (!t || !t.checkInTime) {
            big.textContent = "未打卡";
            msg.textContent = "点击上班打卡开始今日考勤";
            btnIn.disabled = false; btnOut.disabled = true;
            return;
        }
        btnIn.disabled = true;
        const inTime = fmtTime(t.checkInTime);
        big.textContent = inTime;
        if (!t.checkOutTime) {
            msg.textContent = `上班打卡 ${inTime}，状态：${ATT_TEXT[t.status]}`;
            btnOut.disabled = false;
        } else {
            msg.textContent = `已完成：${inTime} 至 ${fmtTime(t.checkOutTime)}，状态：${ATT_TEXT[t.status]}`;
            btnOut.disabled = true;
        }
    }

    async function doClock(kind) {
        const r = await api("/api/attendance/" + kind, { method: "POST" });
        if (r !== null) {
            toast(kind === "clock-in" ? "上班打卡成功" : "下班打卡成功");
            await initToday();
            await loadMyMonth();
            if (role !== "EMPLOYEE") loadSummary();
        }
    }

    async function loadMyMonth() {
        const ym = ymOf(calMonth);
        const rows = await api(`/api/attendance/my?month=${ym}`, { silent: true });
        myRecords = rows || [];
        renderCalendar();
        const body = document.getElementById("myAttBody");
        body.innerHTML = myRecords.length ? myRecords.map(r => `
            <tr>
              <td>${fmtDateZh(r.workDate)}</td>
              <td>${r.checkInTime ? fmtTime(r.checkInTime) : '<span class="text-secondary">-</span>'}</td>
              <td>${r.checkOutTime ? fmtTime(r.checkOutTime) : '<span class="text-secondary">-</span>'}</td>
              <td>${attBadge(r.status)}</td>
            </tr>`).join("")
            : `<tr><td colspan="4"><div class="empty-404 m-3"><div class="big">404</div>
               <div class="mt-1">${ym} 暂无打卡记录</div></div></td></tr>`;
    }

    function renderCalendar() {
        const d = calMonth;
        document.getElementById("calTitle").textContent = `${d.getFullYear()}年${d.getMonth() + 1}月`;
        const map = {};
        myRecords.forEach(r => { map[String(r.workDate).slice(8, 10)] = r.status; });
        const first = new Date(d.getFullYear(), d.getMonth(), 1);
        const lead = (first.getDay() + 6) % 7;              // 周一为第一天
        const days = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        const todayStr = dateNow();
        let cells = [];
        for (let i = 0; i < lead; i++) cells.push("<td></td>");
        for (let day = 1; day <= days; day++) {
            const dateStr = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(day)}`;
            const wd = new Date(d.getFullYear(), d.getMonth(), day).getDay();
            const weekend = wd === 0 || wd === 6;
            const st = map[String(day).padStart(2, "0")];
            const dot = st === undefined ? "" :
                (st === 1 ? '<div class="dot ok">●</div>' : '<div class="dot bad">●</div>');
            cells.push(`<td class="calendar-day ${dateStr === todayStr ? "today" : ""} ${weekend ? "text-secondary" : ""}">
                <div class="day-num">${day}</div>${weekend ? "" : dot}</td>`);
        }
        while (cells.length % 7) cells.push("<td></td>");
        let html = "";
        for (let i = 0; i < cells.length; i += 7) html += `<tr>${cells.slice(i, i + 7).join("")}</tr>`;
        document.getElementById("calBody").innerHTML = html;
    }

    function shiftMonth(delta) {
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
        loadMyMonth();
    }

    async function loadSummary() {
        const month = document.getElementById("sumMonth").value || monthNow();
        const rows = await api("/api/attendance/summary?month=" + month, { silent: true });
        const body = document.getElementById("sumBody");
        if (!rows || !rows.length) {
            body.innerHTML = `<tr><td colspan="7"><div class="empty-404 m-3"><div class="big">404</div>
                <div class="mt-1">${month} 暂无考勤汇总数据</div></div></td></tr>`;
            return;
        }
        body.innerHTML = rows.map(r => {
            const rate = Math.round((r.normalCnt + r.lateCnt + r.earlyCnt) * 100 / Math.max(1, r.workDays));
            return `<tr>
              <td><b>${esc(r.empName)}</b></td>
              <td>${esc(r.deptName)}</td>
              <td><b>${r.workDays}</b> 天</td>
              <td>${attBadge(1)} <span class="ms-1">${r.normalCnt}</span></td>
              <td>${attBadge(2)} <span class="ms-1">${r.lateCnt}</span></td>
              <td>${attBadge(3)} <span class="ms-1">${r.earlyCnt}</span></td>
              <td><span class="status-pill status-on">${rate}%</span></td>
            </tr>`;
        }).join("");
    }

    function exportSummary() {
        const headers = [
            { key: "a", label: "员工姓名" }, { key: "b", label: "部门" }, { key: "c", label: "出勤天数" },
            { key: "d", label: "正常" }, { key: "e", label: "迟到" }, { key: "f", label: "早退" }, { key: "g", label: "出勤率" }
        ];
        const rows = [...document.querySelectorAll("#sumBody tr")]
            .filter(tr => !tr.innerHTML.includes("empty-404"))
            .map(tr => {
                const td = [...tr.children].map(x => x.textContent.trim());
                return { a: td[0], b: td[1], c: td[2].replace(" 天", ""), d: td[3], e: td[4], f: td[5], g: td[6].replace("%", "") };
            });
        exportCSV(`考勤汇总_${document.getElementById("sumMonth").value}.csv`, headers, rows);
        toast("已导出 CSV 文件");
    }

    (async () => {
        if (CTX.empId && CTX.empId !== "null") {
            await initToday();
            await loadMyMonth();
        }
        if (role !== "EMPLOYEE") await loadSummary();
    })();
</script>
</body>
</html>
